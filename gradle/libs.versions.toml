# Every dependency and plugin version lives here. Dependabot updates this file.
[versions]
assertj = "3.27.7"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
google-java-format = "1.36.1"
h2 = "2.5.252"
jacoco = "0.8.15"
jspecify = "1.0.1"
junit = "6.1.3"
maven-publish = "0.37.0"
mockito = "5.24.0"
nullaway = "0.14.2"
spotless = "8.10.3"
sqlite-jdbc = "3.53.4.0"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
