name: Release

# Publishes a tagged commit to Maven Central and attaches the jar to a GitHub Release.
# Trigger: push a tag such as v0.1.0. The tag is the version; nothing in the repo needs a bump,
# but CHANGELOG.md must already have a "## [0.1.0]" section or the job stops before building.
#
# Secrets live in the "maven-central" GitHub environment, never in the repository:
#   CENTRAL_USERNAME, CENTRAL_PASSWORD   Central Portal user token
#   SIGNING_KEY, SIGNING_KEY_ID, SIGNING_PASSWORD   armored GPG private key, its short id, passphrase
# See RELEASING.md for the one-time setup.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag on a side branch must not publish. The tagged commit has to be reachable from main.
      - name: Require the tagged commit to be on main
        run: |
          # The checkout already fetched every branch. Refresh main if credentials allow it, and
          # otherwise fail closed on the copy the checkout made.
          git fetch --no-tags origin main || echo "::warning::Could not refresh origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge it to main and re-tag."
            exit 1
          fi

      - name: Derive version from tag and require a changelog entry
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Add one and re-tag."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            11
            17
            21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build and test the release version
        run: ./gradlew build --no-daemon "-Pversion=${VERSION}"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv: JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

      # Uploads a validated, signed deployment to the Central Portal and releases it. The only
      # human gate is the environment approval above. To inspect a deployment before it goes
      # live, change the task back to publishToMavenCentral and press "Publish" in the Portal.
      - name: Publish to Maven Central
        run: >-
          ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache
          "-Pversion=${VERSION}"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # SQL client users download a jar; they do not resolve Maven coordinates.
      - name: Create GitHub Release with the jar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          cd build/libs
          sha256sum "manyfold-jdbc-${VERSION}.jar" > "manyfold-jdbc-${VERSION}.jar.sha256"
          gh release create "$TAG" \
            --title "manyfold-jdbc ${VERSION}" \
            --notes "See CHANGELOG.md for details. Maven coordinates: io.github.jbburns:manyfold-jdbc:${VERSION}" \
            "manyfold-jdbc-${VERSION}.jar" \
            "manyfold-jdbc-${VERSION}.jar.sha256" \
            "manyfold-jdbc-${VERSION}-sources.jar" \
            "manyfold-jdbc-${VERSION}-javadoc.jar"
